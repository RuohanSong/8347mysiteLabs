{% extends 'myapp/base.html' %}

{% block body_block %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title">Place an Order</h2>
            <form action="{% url 'myapp:placeorder' %}" method="post" class="needs-validation" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Place Order</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
