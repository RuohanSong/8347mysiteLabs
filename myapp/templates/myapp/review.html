<!-- myapp/templates/myapp/review.html -->
{% extends 'myapp/base.html' %}

{% block body_block %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title">Review a Book</h2>

            <form action="{% url 'myapp:review' %}" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Submit Review</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
