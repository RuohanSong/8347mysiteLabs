{% extends 'myapp/base.html' %}

{% block body_block %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>{{ book.title }}</h2>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>Price:</strong> {{ book.price }}</li>
                <li class="list-group-item"><strong>Publisher:</strong> {{ book.publisher }}</li>
            </ul>
            <div class="mt-4 text-center">
                <a href="{% url 'myapp:chk-reviews' book.id %}" class="btn btn-primary">Check the reviews</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
