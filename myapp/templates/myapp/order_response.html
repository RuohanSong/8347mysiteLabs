<!-- myapp/templates/myapp/order_response.html -->
{% extends 'myapp/base.html' %}

{% block body_block %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            {% if books %}
                <h2 class="card-title">Books in the Order</h2>
                <ul class="list-group">
                    {% for book in books %}
                        <li class="list-group-item">
                            <a href="{% url 'myapp:detail' book.id %}">{{ book.title }}</a>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <div class="alert alert-warning" role="alert">
                    <strong>There are no available books!</strong>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
