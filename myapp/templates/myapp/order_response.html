{% extends 'myapp/base.html' %}

{% block body_block %}

    {% if books %}
        <h2>Books in the order</h2>
        <ol>
            {% for book in books %}
                <li>
                    <a href="{% url 'myapp:detail' book.id %}">{{ book.title }}</a>
                </li>
            {% endfor %}
        </ol>

    {% else %}
        <strong>There are no available books!</strong>
    {% endif %}

{% endblock %}
